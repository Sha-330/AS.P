<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ajmal Shan P. Portfolio</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        
        .atom {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .nucleus {
            width: 20px;
            height: 20px;
            background-color: #ffcc00;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .electron {
            width: 10px;
            height: 10px;
            background-color: #00bfff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 50% 50%;
        }

        .orbit {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rotate 2s linear infinite;
        }

        .orbit:nth-child(1) { animation-duration: 2s; }
        .orbit:nth-child(2) { animation-duration: 1.5s; transform: rotate(60deg); }
        .orbit:nth-child(3) { animation-duration: 1.8s; transform: rotate(120deg); }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .admin-container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 90%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #ff5733;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .logout {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ff5733;
            text-decoration: none;
            font-weight: bold;
        }

        .logout:hover {
            color: #ffa500;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Admin Dashboard</h1>
        <table id="visitorTable">
            <thead>
                <tr>
                    <th>Visitor ID</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <a href="index.html" class="logout" onclick="logout()">Logout</a>
    </div>
     <div class="atom">
        <div class="nucleus"></div>
        <div class="orbit">
            <div class="electron" style="transform: translate(30px, 0);"></div>
        </div>
        <div class="orbit">
            <div class="electron" style="transform: translate(-30px, 0);"></div>
        </div>
        <div class="orbit">
            <div class="electron" style="transform: translate(0, 30px);"></div>
        </div>
    </div>

    <script>
        // Check if admin is authenticated
        if (!sessionStorage.getItem('adminAuthenticated')) {
            alert('Unauthorized access. Please log in.');
            window.location.href = 'index.html';
        }

        // Load and display visitors
        const visitors = JSON.parse(localStorage.getItem('portfolioVisitors') || '[]');
        const tbody = document.querySelector('#visitorTable tbody');
        visitors.forEach(visitor => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${visitor.id}</td><td>${visitor.timestamp}</td>`;
            tbody.appendChild(row);
        });

        // Logout function
        function logout() {
            sessionStorage.removeItem('adminAuthenticated');
        }
    </script>
</body>
</html>
