<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ajmal Shan P. Portfolio</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .admin-container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 90%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #ff5733;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .logout {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ff5733;
            text-decoration: none;
            font-weight: bold;
        }

        .logout:hover {
            color: #ffa500;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Admin Dashboard</h1>
        <table id="visitorTable">
            <thead>
                <tr>
                    <th>Visitor ID</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <a href="index.html" class="logout" onclick="logout()">Logout</a>
    </div>

    <script>
        // Check if admin is authenticated
        if (!sessionStorage.getItem('adminAuthenticated')) {
            alert('Unauthorized access. Please log in.');
            window.location.href = 'index.html';
        }

        // Load and display visitors
        const visitors = JSON.parse(localStorage.getItem('portfolioVisitors') || '[]');
        const tbody = document.querySelector('#visitorTable tbody');
        visitors.forEach(visitor => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${visitor.id}</td><td>${visitor.timestamp}</td>`;
            tbody.appendChild(row);
        });

        // Logout function
        function logout() {
            sessionStorage.removeItem('adminAuthenticated');
        }
    </script>
</body>
</html>
